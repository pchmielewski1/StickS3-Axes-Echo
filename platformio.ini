; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
upload_port = /dev/ttyACM0
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
  -DESP32S3
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCORE_DEBUG_LEVEL=5
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  M5Unified=https://github.com/m5stack/M5Unified
  M5PM1=https://github.com/m5stack/M5PM1
extra_scripts =
  post:scripts/gen_firmware_dir.py

; Debug build: same firmware + framebuffer dump over USB CDC for screenshots.
; Capture: pio device monitor | tee capture.log
; Rebuild PNGs: python3 tools/frame_to_png.py capture.log -o docs/screenshots
; Release / M5Burner builds use [env:m5stack-sticks3] (flag OFF).
[env:screenshot]
extends = env:m5stack-sticks3
build_flags =
  ${env:m5stack-sticks3.build_flags}
  -DS3_SCREENSHOT_BRIDGE
